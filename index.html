<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ごほうびどうが">
<title>ごほうびどうが</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" media="print" onload="this.media='all'">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<style>
  :root {
    --bg:#fff7ed; --fg:#374151; --sub:#6b7280; --card:#fff; --line:#fed7aa;
    --accent:#f97316; --accent-deep:#ea580c; --on:#a855f7; --ok:#16a34a; --ng:#ef4444;
    --shadow:0 4px 12px rgba(234,88,12,.14);
    --brand:Comfortaa,"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif; font-size:26px; line-height:1.4;
         -webkit-text-size-adjust:100%; }
  [hidden] { display:none !important; }
  button, input { font:inherit; color:inherit; }
  button { min-height:76px; padding:12px 28px; border-radius:24px; border:3px solid #fff; background:#fff; font-weight:bold; box-shadow:var(--shadow);
           transition:transform .1s;
           cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  button:active { transform:scale(.95); }
  button:focus-visible, input:focus-visible { outline:5px solid var(--accent); outline-offset:3px; }
  button.big { font-size:32px; min-height:96px; padding:16px 40px; }
  button.primary { background:var(--accent-deep); color:#fff; border-color:var(--accent-deep); }
  button[aria-pressed="true"] { background:var(--on); border-color:var(--on); color:#fff; }
  .screen { max-width:1366px; margin:0 auto; padding:20px 28px 40px; }
  .center { text-align:center; }
  .msg { font-size:30px; padding:28px; background:var(--card); border-radius:24px; box-shadow:var(--shadow); text-align:center; margin:20px 0; }
  .msg .row { justify-content:center; margin-top:18px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }

  /* ① */
  #s-who .screen { min-height:100vh; display:flex; flex-direction:column; justify-content:center; }
  #s-who h1 { font-size:48px; margin:0 0 36px; text-align:center; color:var(--accent-deep); }
  #kids { display:flex; flex-wrap:wrap; gap:28px; justify-content:center; }
  #kids button { font-size:44px; min-width:300px; min-height:150px; border-radius:24px; padding:28px 40px;
                 display:flex; flex-direction:column; align-items:center; gap:14px; }
  .kid-icon { width:104px; height:104px; border-radius:50%; background:#ffedd5; color:var(--accent); display:flex; align-items:center; justify-content:center; }
  .kid-icon svg { width:60px; height:60px; }
  #toParent { display:block; margin:60px auto 0; width:max-content; font-size:20px; color:var(--sub); }

  /* ② */
  #appHeader { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:16px; padding:10px 28px; background:var(--accent-deep); }
  .hdr-btn { width:64px; height:64px; min-height:64px; padding:0; border-radius:50%; border:0; background:#fff; color:var(--accent-deep);
             display:flex; align-items:center; justify-content:center; flex:none; box-shadow:none; }
  .hdr-btn svg { width:36px; height:36px; }
  .hdr-who { display:flex; align-items:center; gap:10px; min-width:0; }
  .pts { font-family:var(--brand); font-weight:bold; white-space:nowrap; }
  #hdrPts, #kids .pts { font-size:26px; color:var(--accent-deep); background:#fff; border-radius:999px; padding:4px 16px; }
  #hdrPts { margin-left:6px; }
  #kids .pts { font-size:30px; padding:6px 22px; }
  .hdr-btn[aria-disabled="true"] { opacity:.45; }
  .source-row { display:flex; align-items:center; gap:28px; margin:22px 0 10px; }
  .source-row .source { margin:0; }
  #confirm .q small { display:block; font-size:28px; color:var(--sub); margin-top:10px; }
  .hdr-avatar { width:48px; height:48px; border-radius:50%; background:#fed7aa; color:var(--accent-deep); display:flex; align-items:center; justify-content:center; flex:none; }
  .hdr-avatar svg { width:30px; height:30px; }
  #whoName { font-size:32px; font-weight:900; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hdr-right { margin-left:auto; display:flex; align-items:center; gap:16px; }
  .hdr-time { display:flex; align-items:center; gap:12px; color:#fff; }
  .hdr-time .lbl { font-size:22px; font-weight:bold; }
  #hdrTime { font-family:var(--brand); font-size:46px; font-weight:bold; display:inline-flex; }
  #hdrTime span { display:inline-block; text-align:center; }
  #hdrTime .d { width:.64em; }
  #hdrTime .sg { width:.42em; }
  #hdrTime .co { width:.3em; }
  .note { font-size:22px; color:var(--sub); margin-top:4px; }
  #pickTitle { font-size:36px; margin:18px 0 8px; color:var(--accent-deep); }
  .find { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; }
  .find-rows { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .search { display:flex; gap:12px; }
  .search input { flex:1; min-width:0; min-height:76px; padding:10px 22px; border-radius:24px; border:3px solid var(--line);
                  background:#fff; color:var(--fg); font-size:28px; }
  .who-wrap { position:relative; flex:1; display:flex; gap:8px; min-width:0; }
  #favToggle { flex:none; width:76px; padding:0; font-size:26px; color:var(--accent-deep); }
  #favMenu { position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:4; background:#fff; border-radius:24px; padding:10px;
             box-shadow:0 12px 28px rgba(0,0,0,.25); display:flex; flex-direction:column; gap:6px; max-height:420px; overflow-y:auto; }
  #favMenu button { box-shadow:none; text-align:left; border-color:#fff; background:#fff; flex:none; }
  #favMenu button:active { background:#ffedd5; }
  #bothBtn { padding:12px 22px; line-height:1.25; }
  .checks { display:flex; flex-wrap:wrap; gap:8px 36px; margin-top:12px; }
  .chk { display:inline-flex; align-items:center; gap:12px; min-height:60px; font-weight:normal; cursor:pointer; }
  .chk input { width:34px; height:34px; margin:0; accent-color:var(--accent-deep); flex:none; }
  .source { font-size:22px; color:var(--sub); margin:22px 0 10px; }
  #list { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:22px; }
  .card { display:flex; flex-direction:column; align-items:stretch; text-align:left; padding:0; overflow:hidden;
          min-height:0; border-radius:24px; background:var(--card); border:3px solid #fff; font-weight:normal; }
  .thumb { position:relative; background:#000; }
  .thumb img { display:block; width:100%; height:auto; }
  .card .info { padding:12px 14px 14px; flex:1; display:flex; flex-direction:column; }
  .card .foot { margin-top:auto; padding-top:10px; display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  .card .t { font-size:23px; font-weight:bold; line-height:1.35; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card .c { font-size:20px; color:var(--accent-deep); padding:4px 12px; border-radius:999px;
             background:#ffedd5; font-weight:bold; }
  .card .c:active { background:#fed7aa; }
  .tags { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 12px; font-size:22px; }
  .card .views { font-size:19px; color:var(--sub); }
  #chanBar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:6px 0 16px; }
  #chanName { font-size:28px; font-weight:bold; }
  .heart { display:inline-flex; align-items:center; gap:10px; }
  .heart svg { width:30px; height:30px; flex:none; color:#ec4899; }
  #favBtn[aria-pressed="true"] { background:#fce7f3; border-color:#fce7f3; color:#be185d; box-shadow:none; }
  #favMenu svg { width:26px; height:26px; color:#ec4899; flex:none; }
  #favMenu button { display:flex; align-items:center; gap:12px; }
  .tag { padding:3px 14px; border-radius:999px; background:#f3f4f6; font-weight:bold; }
  .tag.len { background:#374151; color:#fff; font-size:24px; }
  .tag.resume { background:#ffedd5; color:#c2410c; font-weight:bold; }
  .tag.seen { background:#dcfce7; color:#15803d; font-weight:bold; }
  #more { display:block; margin:28px auto 0; }

  /* ③ */
  #s-watch .screen { padding-top:12px; }
  #playerBox:empty { display:none; }
  #playerBox { width:min(100%, calc((100vh - 330px) * 16 / 9)); aspect-ratio:16/9; margin:0 auto; background:#000; }
  #playerBox iframe { display:block; width:100%; height:100%; border:0; }
  #watchTitle { font-size:22px; color:var(--sub); text-align:center; margin:10px 0 0; }
  .under { display:flex; flex-wrap:wrap; gap:24px; align-items:center; justify-content:center; margin-top:14px; }
  .under > button { min-width:320px; }
  button.gray { background:#9ca3af; border-color:#9ca3af; color:#fff; box-shadow:none; }
  button:disabled { opacity:.5; }
  #timeUpBox { display:flex; flex-direction:column; gap:14px; align-items:center; margin-top:28px; }
  #timeUpBox .tu-note { font-size:28px; }
  #timeUpBox .tu-text { font-size:36px; font-weight:bold; color:var(--accent-deep); }

  /* たしかめる */
  /* よみこみ中・できたよ */
  .pill { position:fixed; left:50%; transform:translateX(-50%); z-index:30; display:flex; gap:14px; align-items:center;
          background:var(--accent-deep); color:#fff; font-weight:bold; font-size:30px; padding:14px 34px; border-radius:999px;
          border:2px solid #fff; box-shadow:0 6px 20px rgba(0,0,0,.25); pointer-events:none; }
  #busy { top:50%; transform:translate(-50%,-50%); }
  #toast { bottom:28px; background:var(--ok); }
  .spin { width:28px; height:28px; border:5px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  button.tapped { opacity:.55; }

  #startMsg { font-size:30px; margin:26px 0 6px; }

  #confirm { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; }
  #confirm .box { background:#fff; border-radius:40px; padding:44px 56px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,.25); }
  #confirm .q { font-size:44px; margin-bottom:30px; }

  /* テレビ(リモコンで動かす)。html に tv が付いたときだけ効く */
  .mic { flex:none; width:76px; padding:0; color:var(--accent-deep); display:flex; align-items:center; justify-content:center; }
  .mic svg { width:38px; height:38px; }
  html.tv button:active { transform:none; }
  html.tv .chk { padding:0 14px; border-radius:18px; }
  html.tv .tvf { outline:7px solid #2563eb; outline-offset:4px; box-shadow:0 0 0 4px #fff; position:relative; z-index:2; }
  html.tv #appHeader .tvf { outline-color:#fff; box-shadow:0 0 0 4px #1d4ed8; outline-offset:5px; }
  html.tv .card.tvf { transform:scale(1.03); }
  html.tv #s-watch .screen { max-width:none; padding:10px 28px 0; }
  html.tv #playerBox { width:min(100%, calc((100vh - 196px) * 16 / 9)); }
  html.tv #watchTitle { display:none; }
  html.tv .under { margin-top:12px; }
  html.tv .under { flex-wrap:nowrap; gap:14px; }
  html.tv .under > button { min-width:0; min-height:72px; font-size:26px; padding:8px 22px; white-space:nowrap; }
  html.tv #startBtn { min-width:190px; }
  #ptrNote { bottom:20px; font-size:26px; }
</style>
</head>
<body>

<header id="appHeader" hidden>
  <button class="hdr-btn" id="hdrBack" aria-label="もどる"></button>
  <div class="hdr-who"><span class="hdr-avatar" id="hdrAvatar"></span><span id="whoName"></span><span class="pts" id="hdrPts"></span></div>
  <div class="hdr-right">
    <span class="hdr-time"><span class="lbl">のこりじかん</span><span id="hdrTime"></span></span>
    <button class="hdr-btn" id="addBtn" aria-label="ポイントをつかって じかんをたす"></button>
  </div>
</header>

<!-- せっていがない -->
<section id="s-nosetup" hidden>
  <div class="screen"><div class="msg">せっていがまだだよ</div></div>
</section>

<!-- ① だれがみる? -->
<section id="s-who" hidden>
  <div class="screen">
    <h1>だれがみる?</h1>
    <div id="kids"></div>
    <div id="whoErr" class="msg" hidden>うまくいかなかったよ<div class="row"><button class="big primary" data-retry>もういちど</button></div></div>
    <a id="toParent" href="about.html">おうちのかたへ</a>
  </div>
</section>

<!-- ② えらぶ -->
<section id="s-pick" hidden>
  <div class="screen">
    <h2 id="pickTitle">えらぶ</h2>
    <div class="note" id="carryNote" style="margin-bottom:14px">のこったじかんは、つぎにつかえるよ</div>

    <div id="pickErr" class="msg" hidden>うまくいかなかったよ<div class="row"><button class="big primary" data-retry>もういちど</button></div></div>

    <div id="timeUpPick" class="msg" hidden>
      じかんになったよ
      <div class="row"><button class="big primary" id="addBtn2">ポイントをつかって 30ぷん たす</button></div>
    </div>

    <div id="pickMain">
      <div class="find">
        <div class="find-rows">
          <form class="search" id="whoForm" autocomplete="off">
            <div class="who-wrap">
              <input id="who" type="search" placeholder="だれの?" enterkeyhint="search" aria-label="だれの">
              <button type="button" id="favToggle" aria-label="すきなひとをえらぶ" aria-expanded="false" hidden>▼</button>
              <div id="favMenu" hidden></div>
            </div>
            <button type="button" class="mic" data-for="who" aria-label="こえで いれる" hidden></button>
            <button type="submit">さがす</button>
          </form>
          <form class="search" id="searchForm" autocomplete="off">
            <input id="q" type="search" placeholder="なにをみる?" enterkeyhint="search" aria-label="なにをみる">
            <button type="button" class="mic" data-for="q" aria-label="こえで いれる" hidden></button>
            <button type="submit">さがす</button>
          </form>
        </div>
        <button id="bothBtn" class="primary" type="button">あわせて<br>さがす</button>
      </div>
      <div class="checks">
        <label class="chk"><input type="checkbox" id="safeChk">こわくない</label>
        <label class="chk"><input type="checkbox" id="hideSeen">見おわったのをはぶく</label>
      </div>
      <div id="startMsg" class="note" hidden>さがしたいものを いれて「さがす」をおしてね</div>

      <div class="source-row" id="source">
        <span class="source">YouTube のどうが</span>
        <label class="chk"><input type="checkbox" id="popChk">にんきじゅん</label>
      </div>
      <div id="notFoundMsg" class="msg" hidden>そのひとは みつからなかったよ</div>
      <div id="quotaMsg" class="msg" hidden>きょうはもうさがせないよ。すきなひとからえらんでね</div>
      <div id="chanBar" hidden>
        <span id="chanName"></span>
        <button id="favBtn" type="button" aria-pressed="false"></button>
      </div>
      <div id="list"></div>
      <div id="emptyMsg" class="msg" hidden>いまのじかんでみられるどうがはないよ。のこったじかんは、つぎにつかえるよ</div>
      <button id="more" class="big" hidden>ほかのどうがをみる</button>
    </div>
  </div>
</section>

<!-- ③ みる -->
<section id="s-watch" hidden>
  <div class="screen">
    <div id="playerBox"></div>
    <div id="watchTitle"></div>
    <div class="under">
      <button class="big" id="rewBtn" hidden>◀ 10びょう</button>
      <button class="big primary" id="startBtn">はじめる</button>
      <button class="big" id="fwdBtn" hidden>10びょう ▶</button>
      <button class="big" id="ccBtn" aria-pressed="false" hidden>じまく</button>
      <button class="big" id="ptrBtn" hidden>ゆびで おす</button>
      <button class="big gray" id="nextBtn">ほかをさがす</button>
    </div>
    <div id="timeUpBox" hidden>
      <span class="tu-text">じかんになったよ</span>
      <span class="tu-note">つづきをみると、つぎのじかんが へるよ</span>
      <button class="big primary" id="keepBtn">つづきをみる</button>
    </div>
    <div id="watchErr" class="msg" hidden>このどうがは みられないよ</div>
  </div>
</section>

<div id="busy" class="pill" hidden><span class="spin"></span>よみこみ中…</div>
<div id="toast" class="pill" hidden></div>
<div id="ptrNote" class="pill" hidden>やじるしで うごかして「けってい」で おす。「もどる」で おわり</div>

<!-- じかんをたす? -->
<div id="confirm" hidden>
  <div class="box">
    <div class="q" id="confirmQ"></div>
    <div class="row" style="justify-content:center">
      <button class="big primary" id="yesAdd">はい</button>
      <button class="big" id="noAdd">やめる</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var TIMEOUT_MS = 20000;
  var SAVE_EVERY_MS = 30000;

  // ---- せってい(gas と pass は # からだけ読む。画面やログには出さない) ----
  var hp = new URLSearchParams(location.hash.replace(/^#/, ""));
  var GAS = hp.get("gas") || "";
  var PASS = hp.get("pass") || "";

  // テレビのアプリ(tv/ の自作アプリ)の中で開いたとき。#tv=1 はパソコンのキーボードで試す用
  var TVB = window.GohoubiTV || null;
  var TV = !!TVB || hp.get("tv") === "1";
  if (TV) {
    document.documentElement.classList.add("tv");
    var vpMeta = document.querySelector('meta[name="viewport"]');
    if (vpMeta) vpMeta.setAttribute("content", "width=1366");   // 1920x1080 のテレビで iPad と同じ大きさに見せる
  }
  // テレビのときだけ中身が入る(initTv)
  var tv = { lastCard: null, afterLoad: function () {}, playing: function () {}, reset: function () {},
             buttons: function () {}, gone: function () {}, onPlaying: function () {} };

  var $ = function (id) { return document.getElementById(id); };

  function show(name) {
    ["s-nosetup", "s-who", "s-pick", "s-watch"].forEach(function (id) { $(id).hidden = (id !== name); });
    $("appHeader").hidden = (name !== "s-pick" && name !== "s-watch");
    window.scrollTo(0, 0);
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16); crypto.getRandomValues(b);
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join("");
    return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
  }

  // アイコンの図形は Lucide(ISC License)
  function svg(body) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + "</svg>";
  }
  var ICONS = {
    carrot: svg('<path d="M15 16a1 1 0 0 0-7-7q-4 4-5.987 12.385a.5.5 0 0 0 .602.602Q11 20 15 16l-3-3"/><path d="M15 9q4 4 7 0-3-4-7 0 4-4 0-7-4 3 0 7"/><path d="m8 15-2.58-2.58"/>'),
    image: svg('<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>'),
    plus: svg('<path d="M5 12h14"/><path d="M12 5v14"/>'),
    back: svg('<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>'),
    heart: svg('<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/>'),
    mic: svg('<path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/>'),
    heartFill: svg('<path fill="currentColor" d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/>')
  };
  var KID_ICONS = { c1: "carrot", c2: "image" };
  function kidIcon(childId) { return ICONS[KID_ICONS[childId]] || ""; }
  $("hdrBack").innerHTML = ICONS.back;
  $("addBtn").innerHTML = ICONS.plus;

  function minsUp(sec) { return Math.max(0, Math.ceil(sec / 60)); }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  // CHI-GO POINT ののこり。読めないときは「?」
  function fmtPts(p) { return (typeof p === "number" ? p.toLocaleString("ja-JP") : "?") + "pt"; }
  // ポイントをつかう操作の番号(英字入り。やりなおしでも同じ番号を使う)
  function opId() {
    var d = new Date();
    var b = new Uint8Array(6); crypto.getRandomValues(b);
    var h = Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join("");
    return "dg-" + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "-" + h;
  }
  // 残り時間は 分:秒。超えたら -02:05 のように出す
  function fmtLeft(sec) {
    var l = Math.ceil(sec);
    var a = Math.abs(l);
    return (l < 0 ? "-" : "") + pad2(Math.floor(a / 60)) + ":" + pad2(a % 60);
  }
  // 1文字ずつ同じ幅の枠に入れて、「のこりじかん」と「:」が動かないようにする
  var lastTimeText = null;
  function setTime(sec) {
    var t = fmtLeft(sec);
    if (t === lastTimeText) return;
    lastTimeText = t;
    var neg = t.charAt(0) === "-";
    var body = neg ? t.slice(1) : t;
    var html = '<span class="sg">' + (neg ? "-" : "") + "</span>";
    body.split("").forEach(function (ch) {
      html += ch === ":" ? '<span class="co">:</span>' : '<span class="d">' + ch + "</span>";
    });
    $("hdrTime").innerHTML = html;
    $("hdrTime").setAttribute("aria-label", "のこりじかん " + t);
  }
  // 再生回数: 8,532かい / 1.2まんかい / 35まんかい / 1.4おくかい
  function fmtViews(n) {
    n = Number(n) || 0;
    var one = function (x) { return (Math.floor(x * 10) / 10).toString(); };
    if (n >= 1e8) return one(n / 1e8) + "おく回";
    if (n >= 1e5) return Math.floor(n / 1e4) + "まん回";
    if (n >= 1e4) return one(n / 1e4) + "まん回";
    return n.toLocaleString("ja-JP") + "回";
  }
  function fmtLen(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    var ss = (s < 10 ? "0" : "") + s;
    return h ? h + ":" + (m < 10 ? "0" : "") + m + ":" + ss : m + ":" + ss;
  }

  // ---- 押したことがすぐわかるように ----
  // iPad の Safari で :active を効かせる
  document.addEventListener("touchstart", function () {}, { passive: true });
  var lastTap = null, lastTapAt = 0;
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (b) { lastTap = b; lastTapAt = Date.now(); }
  }, true);

  var busyCount = 0, tappedNow = [];
  function busyOn() {
    busyCount++;
    $("busy").hidden = false;
    if (lastTap && Date.now() - lastTapAt < 500 && document.body.contains(lastTap)) {
      lastTap.classList.add("tapped"); tappedNow.push(lastTap);
    }
  }
  function busyOff() {
    busyCount = Math.max(0, busyCount - 1);
    if (busyCount) return;
    $("busy").hidden = true;
    tappedNow.forEach(function (b) { b.classList.remove("tapped"); });
    tappedNow = [];
  }
  var toastTimer;
  function toast(text) {
    $("toast").textContent = text; $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $("toast").hidden = true; }, 2500);
  }

  // ---- GAS との通信 ----
  function api(action, data, opts) {
    var body = { pass: PASS, action: action };
    Object.keys(data || {}).forEach(function (k) { body[k] = data[k]; });
    var init = { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) };
    if (opts && opts.keepalive) { init.keepalive = true; return fetch(GAS, init); }
    var quiet = !!(opts && opts.quiet);   // 見ている間の保存では「よみこみ中」を出さない
    if (!quiet) busyOn();
    var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
    if (ctrl) init.signal = ctrl.signal;
    var timer;
    var timeout = new Promise(function (_, reject) {
      timer = setTimeout(function () { if (ctrl) ctrl.abort(); reject({ code: "timeout" }); }, TIMEOUT_MS);
    });
    var req = fetch(GAS, init).then(function (res) { return res.text(); }).then(function (text) {
      var j;
      try { j = JSON.parse(text); } catch (e) { throw { code: "not_json" }; }
      if (!j || j.ok !== true) throw { code: (j && j.error) || "unknown" };
      return j;
    });
    return Promise.race([req, timeout]).then(
      function (v) { clearTimeout(timer); if (!quiet) busyOff(); return v; },
      function (e) {
        clearTimeout(timer);
        if (!quiet) busyOff();
        var code = (e && e.code) ? e.code : "network";
        console.warn("gohoubi: " + action + " " + code); // URL と合言葉は出さない
        throw { code: code };
      }
    );
  }

  // うまくいかなかったよ + もういちど
  function showErr(boxId, retry) {
    var box = $(boxId);
    box.hidden = false;
    box.querySelector("[data-retry]").onclick = function () { box.hidden = true; retry(); };
  }

  // ---- じょうたい ----
  var S = null;        // えらんだ子のこと
  var W = null;        // いまみている再生
  var gen = 0;         // 一覧の読みこみ番号(古い答えをすてる)

  // ================= ① だれがみる? =================
  var kids = null;
  function loadKids() {
    $("whoErr").hidden = true;
    api("children").then(function (r) {
      kids = r.children || [];
      renderKids();
    }, function () {
      showErr("whoErr", loadKids);
    });
  }
  function renderKids() {
    var box = $("kids"); box.innerHTML = "";
    kids.forEach(function (k) {
      var b = document.createElement("button");
      b.className = "primary";
      var icon = kidIcon(k.childId);
      if (icon) {
        var c = document.createElement("span"); c.className = "kid-icon"; c.innerHTML = icon;
        b.appendChild(c);
      }
      b.appendChild(document.createTextNode(k.name));
      var pt = document.createElement("span"); pt.className = "pts"; pt.textContent = fmtPts(k.points);
      b.appendChild(pt);
      b.onclick = function () { pickChild(k); };
      box.appendChild(b);
    });
    tv.reset();
  }
  function goWho() {
    gen++;
    S = null;
    $("pickErr").hidden = true;
    show("s-who");
    loadKids();   // ポイントが変わっているかもしれないので、毎回よみなおす
  }

  function pickChild(k) {
    $("whoErr").hidden = true;
    api("selectChild", { childId: k.childId }).then(function (r) {
      S = {
        childId: k.childId, name: k.name,
        remaining: Number(r.remainingSeconds) || 0,
        points: typeof r.points === "number" ? r.points : null,
        cost: typeof r.cost === "number" ? r.cost : null,
        favorites: r.favorites || [],
        q: "", who: "", popular: false, notScary: false, hideWatched: false,
        items: [], seen: {}, next: null, quota: false, notFound: false, loading: false, addReq: null
      };
      $("list").innerHTML = "";   // 前にえらんだ子の検索結果を残さない
      tv.lastCard = null;
      pickedWho = null;
      openPick("えらぶ");
    }, function () {
      showErr("whoErr", function () { pickChild(k); });
    });
  }

  // ================= ② えらぶ =================
  function openPick(title) {
    $("pickTitle").textContent = title;
    $("whoName").textContent = S.name;
    $("hdrAvatar").innerHTML = kidIcon(S.childId);
    $("hdrAvatar").hidden = !kidIcon(S.childId);
    $("q").value = S.q;
    $("who").value = S.who;
    $("popChk").checked = S.popular;
    $("safeChk").checked = S.notScary;
    $("hideSeen").checked = S.hideWatched;
    renderFavs();
    show("s-pick");
    renderPick();   // ひらいただけでは さがさない
  }

  // なにかを さがしているか
  function isActive() { return !!(S.q || S.who); }

  // すきなひと: ▼ で選ぶと「だれの?」に入る(さがすのは「さがす」を押したとき)
  function closeFavs() { $("favMenu").hidden = true; $("favToggle").setAttribute("aria-expanded", "false"); }
  function renderFavs() {
    var box = $("favMenu"); box.innerHTML = "";
    closeFavs();
    $("favToggle").hidden = !S.favorites.length;
    S.favorites.forEach(function (f) {
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = ICONS.heartFill;
      b.appendChild(document.createTextNode(f.name));
      b.onclick = function () {
        $("who").value = f.name;
        pickedWho = { name: f.name, channelId: f.channelId };
        closeFavs();
      };
      box.appendChild(b);
    });
  }
  $("favToggle").onclick = function (e) {
    e.stopPropagation();
    var open = $("favMenu").hidden;
    $("favMenu").hidden = !open;
    this.setAttribute("aria-expanded", String(open));
  };
  document.addEventListener("click", function (e) {
    if (!$("favMenu").hidden && !$("favMenu").contains(e.target)) closeFavs();
  });

  function renderPick() {
    if (!S) return;
    if (!W) setTime(S.remaining);
    renderPoints();
    renderChanBar();
    var over = S.remaining <= 0;
    $("timeUpPick").hidden = !over;
    $("pickMain").hidden = over;
    $("more").hidden = S.loading || !S.next;
    $("quotaMsg").hidden = !S.quota;
    $("notFoundMsg").hidden = !S.notFound;
    $("emptyMsg").hidden = S.loading || S.quota || S.notFound || S.items.length > 0 || !!S.next || !S.loaded;
    var start = !isActive();
    $("startMsg").hidden = !start;
    $("source").hidden = start;
  }

  function buildQuery(cursor) {
    var q = { childId: S.childId, popular: S.popular, notScary: S.notScary, hideWatched: S.hideWatched, cursor: cursor || null };
    if (S.who) { q.mode = "person"; q.who = S.who; q.q = S.q; if (S.whoChannelId) q.channelId = S.whoChannelId; }
    else { q.mode = "search"; q.q = S.q; }
    return q;
  }

  // 条件が変わった: cursor を消して読みなおす
  function reload() {
    S.items = []; S.seen = {}; S.next = null; S.quota = false; S.notFound = false; S.loaded = false; S.chanId = null;
    $("list").innerHTML = "";
    $("pickErr").hidden = true;
    if (!isActive()) {      // はじめの画面にもどる(さがさない)
      gen++; S.loading = false;
      renderPick();
      return;
    }
    load(false);
  }

  function load(more) {
    var my = ++gen;
    var autoLeft = 3;   // items が空で nextCursor があるときの自動の続き(1回の操作で3回まで)
    var firstNew = null;
    S.loading = true;
    $("pickErr").hidden = true;
    renderPick();
    var step = function (cursor) {
      api("list", buildQuery(cursor)).then(function (r) {
        if (my !== gen || !S) return;
        if (typeof r.remainingSeconds === "number") S.remaining = r.remainingSeconds;
        if (r.quota === true) S.quota = true;
        if (r.notFound === true) S.notFound = true;
        if (r.channelId) S.chanId = r.channelId;
        var added = 0;
        (r.items || []).forEach(function (it) {
          if (!it || !it.videoId || S.seen[it.videoId]) return;
          S.seen[it.videoId] = true;
          S.items.push(it);
          var el = card(it);
          if (!firstNew) firstNew = el;
          $("list").appendChild(el);
          added++;
        });
        S.next = r.nextCursor || null;
        if (added === 0 && S.next && autoLeft > 0 && S.remaining > 0) { autoLeft--; step(S.next); return; }
        S.loading = false; S.loaded = true;
        renderPick();
        tv.afterLoad(firstNew);
      }, function () {
        if (my !== gen || !S) return;
        S.loading = false;
        renderPick();
        $("more").hidden = true;
        showErr("pickErr", function () { if (more) load(true); else reload(); });
      });
    };
    step(more ? S.next : null);
  }

  function card(it) {
    var b = document.createElement("button");
    b.className = "card";
    var th = document.createElement("div"); th.className = "thumb";
    var img = document.createElement("img");
    img.src = it.thumbnail; img.alt = ""; img.loading = "lazy";
    th.appendChild(img);
    var info = document.createElement("div"); info.className = "info";
    var t = document.createElement("div"); t.className = "t"; t.textContent = it.title;
    var c = document.createElement("span"); c.className = "c"; c.textContent = it.channelTitle;
    c.setAttribute("role", "button");
    c.onclick = function (e) { e.stopPropagation(); showChannel(it); };
    var tags = document.createElement("div"); tags.className = "tags";
    var len = document.createElement("span"); len.className = "tag len"; len.textContent = fmtLen(it.seconds);
    tags.appendChild(len);
    var rs = document.createElement("span"); rs.className = "tag resume";
    var sn = document.createElement("span"); sn.className = "tag seen"; sn.textContent = "見おわった";
    tags.appendChild(rs); tags.appendChild(sn);
    var vw = document.createElement("div"); vw.className = "views"; vw.textContent = "さいせい " + fmtViews(it.viewCount);
    vw.hidden = typeof it.viewCount !== "number";
    var foot = document.createElement("div"); foot.className = "foot";
    foot.appendChild(c); foot.appendChild(vw);
    info.appendChild(t); info.appendChild(foot);
    b.appendChild(tags); b.appendChild(th); b.appendChild(info);
    it._mark = function () {
      rs.hidden = !it.resume;
      if (it.resume) rs.textContent = "つづき " + minsUp(it.resume.left) + "ふん";
      sn.hidden = !it.watched;
    };
    it._mark();
    b.onclick = function () { tv.lastCard = b; openWatch(it); };
    return b;
  }

  // kind: word=なにを / who=だれの / both=あわせて
  // ▼やチャンネル名で選んだ人は、名前を書きかえないかぎり チャンネルIDで さがす
  var pickedWho = null;
  function runSearch(kind) {
    var q = $("q").value.trim(), who = $("who").value.trim();
    if (kind === "word") who = "";
    if (kind === "who") q = "";
    $("q").blur(); $("who").blur();
    closeFavs();
    S.q = q; S.who = who;
    S.whoChannelId = (pickedWho && who && pickedWho.name === who) ? pickedWho.channelId : null;
    reload();
  }
  $("who").addEventListener("input", function () { pickedWho = null; });

  // 動画のチャンネル名を押した: そのチャンネルの動画だけを出す
  function showChannel(it) {
    pickedWho = { name: it.channelTitle, channelId: it.channelId };
    $("who").value = it.channelTitle;
    $("q").value = "";
    runSearch("who");
  }

  // 検索結果の上: その人を「すきなひと」に とうろくする
  function renderChanBar() {
    var on = !!(S && S.who && S.chanId && S.items.length);
    $("chanBar").hidden = !on;
    if (!on) return;
    var first = S.items.filter(function (i) { return i.channelId === S.chanId; })[0];
    $("chanName").textContent = first ? first.channelTitle : S.who;
    var fav = S.favorites.some(function (f) { return f.channelId === S.chanId; });
    var b = $("favBtn");
    b.setAttribute("aria-pressed", String(fav));
    b.disabled = fav;
    b.innerHTML = '<span class="heart">' + (fav ? ICONS.heartFill : ICONS.heart) + "<span>" + (fav ? "すきなひと" : "すきなひとに とうろく") + "</span></span>";
  }
  $("favBtn").onclick = function () {
    var s = S; if (!s || !s.chanId) return;
    var id = s.chanId;
    api("addFavorite", { childId: s.childId, channelId: id }).then(function (r) {
      if (S !== s) return;
      s.favorites = r.favorites || s.favorites;
      renderFavs();
      renderChanBar();
      toast("とうろくしたよ");
    }, function () { if (S === s) toast("うまくいかなかったよ"); });
  };
  $("searchForm").onsubmit = function (e) { e.preventDefault(); runSearch("word"); };
  $("whoForm").onsubmit = function (e) { e.preventDefault(); runSearch("who"); };
  $("bothBtn").onclick = function () { runSearch("both"); };
  // にんきじゅん: いまの検索結果を、再生回数の多い順にならべかえる
  $("popChk").onchange = function () { S.popular = this.checked; if (isActive()) reload(); };
  $("safeChk").onchange = function () { S.notScary = this.checked; reload(); };
  $("hideSeen").onchange = function () { S.hideWatched = this.checked; reload(); };
  $("more").onclick = function () { if (S.next) load(true); };
  $("hdrBack").onclick = function () {
    if (W) leave(W, "つぎをえらぶ"); else goWho();
  };

  // ポイントをつかって30分たす(無料で足す入口はない)
  function renderPoints() {
    if (!S) return;
    $("hdrPts").textContent = fmtPts(S.points);
    var can = S.cost !== null && S.points !== null && S.points >= S.cost;
    $("addBtn").setAttribute("aria-disabled", String(!can));
  }
  function askAdd() {
    if (!S) return;
    if (S.cost === null || S.points === null) { toast("いまは つかえないよ"); return; }
    if (S.points < S.cost) { toast("ポイントが たりないよ(あと " + (S.cost - S.points) + "pt)"); return; }
    $("confirmQ").innerHTML = S.cost + "ポイント つかって<br>30ぷん たす?<small>いま " + fmtPts(S.points) + "</small>";
    $("confirm").hidden = false;
  }
  $("addBtn").onclick = askAdd;
  $("addBtn2").onclick = askAdd;
  $("noAdd").onclick = function () { $("confirm").hidden = true; };
  $("yesAdd").onclick = function () {
    $("confirm").hidden = true;
    if (!S) return;
    if (!S.addReq) S.addReq = opId();   // 前のが うまくいかなかったときは、同じ番号でやりなおす(二重に引かれない)
    sendAdd();
  };
  function sendAdd() {
    var s = S; if (!s) return;
    $("pickErr").hidden = true;
    api("spendPoints", { childId: s.childId, opId: s.addReq }).then(function (r) {
      if (S !== s) return;
      s.addReq = null;
      var before = s.remaining;
      if (typeof r.remainingSeconds === "number") s.remaining = r.remainingSeconds;
      s.points = typeof r.points === "number" ? r.points : null;
      if (r.spent === true) {
        toast("30ぷん たしたよ");
        if (W) addedWhileWatching(W);
      } else {
        toast(r.reason === "short" ? "ポイントが たりないよ" : "いまは つかえないよ");
      }
      if (r.spent === true && s.remaining > 0 && before <= 0 && !s.loading && isActive()) reload(); else renderPick();
    }, function () {
      if (S !== s) return;
      if (W) { toast("うまくいかなかったよ"); return; }
      showErr("pickErr", sendAdd); // やりなおしは同じ番号(二重に引かれない)
    });
  }

  // ================= ③ みる =================
  var ytReady = new Promise(function (resolve) { window.onYouTubeIframeAPIReady = resolve; });
  (function () {
    var s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  })();

  function openWatch(it) {
    if (S.remaining <= 0) return;
    var sess = {
      item: it, videoId: it.videoId, childId: S.childId, recordId: uuid(),
      acc: 0, lastPos: null, position: it.resume ? Number(it.resume.position) || 0 : 0,
      startRemaining: S.remaining, mismatch: 0, started: false, lastSaveAt: 0,
      timeUp: false, keepGoing: false, ended: false, closed: false, player: null, tick: null
    };
    W = sess;
    $("watchTitle").textContent = it.title;
    showPlayButtons();
    $("watchErr").hidden = true;
    renderWatchLeft(sess);
    show("s-watch");
    createPlayer(sess, it.resume ? sess.position : 0);
    sess.tick = setInterval(function () { tick(sess); }, 500);
  }

  function showPlayButtons() {
    $("timeUpBox").hidden = true;
    $("startBtn").hidden = false;
    $("nextBtn").hidden = false;
    tv.buttons(true);
  }

  // 見ている間に時間を足したとき
  function addedWhileWatching(sess) {
    sess.startRemaining += 1800;
    if (leftOf(sess) > 0) {
      sess.keepGoing = false;
      if (sess.timeUp) {
        sess.timeUp = false;
        sess.lastPos = null;
        showPlayButtons();
        createPlayer(sess, sess.position);
      }
    }
    renderWatchLeft(sess);
  }

  // 「はじめる」: 動かなければ、プレーヤーの ▶ を案内する
  function setPlayLabel(playing) { $("startBtn").textContent = playing ? "とめる" : "はじめる"; tv.playing(playing); }
  $("startBtn").onclick = function () {
    var sess = W;
    if (!sess || !sess.player || !sess.player.playVideo) return;
    var st = sess.player.getPlayerState ? sess.player.getPlayerState() : -1;
    if (st === 1 || st === 3) { try { sess.player.pauseVideo(); } catch (e) {} setPlayLabel(false); return; }
    try { sess.player.playVideo(); } catch (e) {}
    setTimeout(function () {
      if (W !== sess || !sess.player || !sess.player.getPlayerState) return;
      var st = sess.player.getPlayerState();
      if (st !== 1 && st !== 3) toast("がめんの ▶ を おしてね");
    }, 2500);
  };

  function createPlayer(sess, startAt) {
    $("startBtn").disabled = true;
    setPlayLabel(false);
    var box = $("playerBox"); box.innerHTML = "";
    var holder = document.createElement("div"); box.appendChild(holder);
    ytReady.then(function () {
      if (W !== sess || sess.closed) return;
      var vars = { playsinline: 1, rel: 0, autoplay: 0, controls: 1, fs: 0, iv_load_policy: 3, origin: location.origin };
      if (startAt > 0) vars.start = Math.floor(startAt);
      sess.player = new YT.Player(holder, {
        width: "100%", height: "100%", videoId: sess.videoId, playerVars: vars,
        events: {
          onReady: function () { if (W === sess) $("startBtn").disabled = false; },
          onStateChange: function (e) { onState(sess, e.data); },
          onError: function () { if (W === sess) $("watchErr").hidden = false; }
        }
      });
    });
  }

  function removePlayer(sess) {
    try { if (sess.player && sess.player.destroy) sess.player.destroy(); } catch (e) {}
    sess.player = null;
    $("playerBox").innerHTML = "";
    tv.playing(false);
    tv.gone();
  }

  // 残りが0になったら1回だけ止める。プレーヤーを消して全画面を閉じ、案内を出す
  function timeUp(sess) {
    sess.timeUp = true;
    sess.lastSaveAt = Date.now();
    requestSave(sess);
    removePlayer(sess);
    $("timeUpBox").hidden = false;
    $("startBtn").hidden = true;
    $("nextBtn").hidden = true;
    tv.buttons(false);
    renderWatchLeft(sess);
  }

  function leftOf(sess) { return sess.startRemaining - sess.acc; }

  function renderWatchLeft(sess) {
    setTime(leftOf(sess));
  }

  // 0.5秒ごとに、本編の再生位置が進んだ分だけを数える(test/index.html と同じ方式)
  function tick(sess) {
    if (sess.closed) return;
    var p = sess.player;
    if (!p || !p.getPlayerState) { renderWatchLeft(sess); return; }
    var st = p.getPlayerState();
    var pos = p.getCurrentTime ? (p.getCurrentTime() || 0) : 0;
    if (st === 1) {
      if (sess.lastPos !== null) {
        var d = pos - sess.lastPos;
        if (d > 0 && d <= 1.5) sess.acc += d;   // 先送り・巻き戻し・広告は数えない
      }
      sess.lastPos = pos;
      sess.position = pos;

      // ちがう動画が2回つづけて見えたら止めてもどる
      var vd = p.getVideoData ? p.getVideoData() : null;
      var vid = vd && vd.video_id;
      if (vid && vid !== sess.videoId) {
        sess.mismatch++;
        if (sess.mismatch >= 2) { try { p.stopVideo(); } catch (e) {} leave(sess, "えらぶ"); return; }
      } else {
        sess.mismatch = 0;
      }

      if (!sess.started && sess.acc > 0) {
        sess.started = true; sess.lastSaveAt = Date.now(); requestSave(sess);
      } else if (sess.started && Date.now() - sess.lastSaveAt >= SAVE_EVERY_MS) {
        sess.lastSaveAt = Date.now(); requestSave(sess);
      }

      if (!sess.keepGoing && leftOf(sess) <= 0) { timeUp(sess); return; }
    } else {
      sess.lastPos = null;
      if (st === 2) sess.position = pos;
    }
    renderWatchLeft(sess);
  }

  function onState(sess, st) {
    if (sess.closed) return;
    if (W === sess) setPlayLabel(st === 1 || st === 3);
    if (W === sess && st === 1) tv.onPlaying();
    if (st === 2) {
      try { sess.position = sess.player.getCurrentTime() || sess.position; } catch (e) {}
      if (sess.started) { sess.lastSaveAt = Date.now(); requestSave(sess); }
    } else if (st === 0) {
      sess.ended = true;
      try { sess.position = sess.player.getDuration() || sess.position; } catch (e) {}
      leave(sess, "つぎをえらぶ");
    }
  }

  // 保存して、プレーヤーをこわして、②にもどる
  function leave(sess, title) {
    if (sess.closed) return;
    sess.closed = true;
    clearInterval(sess.tick);
    if (sess.player && !sess.ended) { try { sess.position = sess.player.getCurrentTime() || sess.position; } catch (e) {} }
    if (sess.started || sess.ended) requestSave(sess);
    removePlayer(sess);
    if (W === sess) W = null;

    var it = sess.item;
    if (sess.ended) { it.watched = true; it.resume = null; }
    else if (sess.started) {
      var dur = Number(it.seconds) || 0;
      it.resume = { position: Math.floor(sess.position), left: Math.max(0, dur - Math.floor(sess.position)) };
    }
    if (it._mark) it._mark();

    if (S && S.childId === sess.childId) {
      S.remaining = Math.min(S.remaining, Math.floor(leftOf(sess)));
      openPick(title);
    }
  }

  $("nextBtn").onclick = function () { if (W) leave(W, "つぎをえらぶ"); };
  $("keepBtn").onclick = function () {
    var sess = W; if (!sess) return;
    sess.keepGoing = true;
    sess.timeUp = false;
    sess.lastPos = null;
    showPlayButtons();
    createPlayer(sess, sess.position);
  };

  // ---- saveWatch: 同時に1つだけ。失敗したら次の機会に最新の値で ----
  var saveQ = [], sending = false;
  function snapshot(sess) {
    return {
      childId: sess.childId, recordId: sess.recordId, videoId: sess.videoId,
      watchedSeconds: Math.round(sess.acc), position: Math.floor(sess.position || 0), ended: !!sess.ended
    };
  }
  function requestSave(sess) {
    if (saveQ.indexOf(sess) < 0) saveQ.push(sess);
    else if (sending && saveQ[0] === sess) sess.again = true;
    pump();
  }
  function pump() {
    if (sending || !saveQ.length) return;
    var sess = saveQ[0];
    sess.again = false;
    sending = true;
    api("saveWatch", snapshot(sess), { quiet: true }).then(function (r) {
      sending = false;
      if (!sess.again) saveQ.shift();
      if (typeof r.remainingSeconds === "number" && S && S.childId === sess.childId && !W) {
        S.remaining = r.remainingSeconds;
        renderPick();
      }
      pump();
    }, function () {
      sending = false; // 列にのこしておき、次に保存するときに最新の値で送る
    });
  }
  function flushOnHide() {
    var list = saveQ.slice();
    if (W && W.started && list.indexOf(W) < 0) list.push(W);
    list.forEach(function (sess) {
      if (sess === W && sess.player) { try { sess.position = sess.player.getCurrentTime() || sess.position; } catch (e) {} }
      api("saveWatch", snapshot(sess), { keepalive: true }).catch(function () {});
    });
  }
  window.addEventListener("pagehide", flushOnHide);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden" && W && W.started) requestSave(W);
  });

  // ================= テレビ(リモコン) =================
  // 上下左右で青いわくを動かし、決定で押す。プレーヤーの中には入らない(プレーヤーに何も重ねない)
  function initTv() {
    var cur = null, saved = null, lastScope = "main";
    var mics = document.querySelectorAll(".mic");
    Array.prototype.forEach.call(mics, function (m) {
      m.innerHTML = ICONS.mic; m.hidden = false;
      m.onclick = function () { listen(m.getAttribute("data-for")); };
    });

    function vis(el) { return el.getClientRects().length > 0; }
    function scopeEl() {
      if (!$("confirm").hidden) return $("confirm");
      if (!$("favMenu").hidden) return $("favMenu");
      return document.body;
    }
    function items() {
      return Array.prototype.filter.call(
        scopeEl().querySelectorAll('button, input[type="search"], label.chk, a[href]'),
        function (el) { return vis(el) && (!el.disabled || el.id === "startBtn"); });
    }
    function set(el) {
      if (cur) cur.classList.remove("tvf");
      cur = el || null;
      if (!cur) return;
      cur.classList.add("tvf");
      if (cur.closest("#favMenu")) cur.scrollIntoView({ block: "nearest" });
      else if (cur.closest("#list") || cur.id === "more") cur.scrollIntoView({ block: "center" });
      else if (!cur.closest("#appHeader")) window.scrollTo(0, 0);
    }
    function def(prev) {
      var sc = scopeEl(), el = null;
      if (sc.id === "confirm") el = $("noAdd");            // 押しまちがいで ポイントをつかわないように「やめる」から
      else if (sc.id === "favMenu") el = sc.querySelector("button");
      else if (prev === "favMenu" && pickedWho) el = $("whoForm").querySelector('button[type="submit"]');
      else if (!$("s-who").hidden) el = $("kids").querySelector("button");
      else if (!$("s-pick").hidden) {
        if (tv.lastCard && document.body.contains(tv.lastCard) && vis(tv.lastCard)) el = tv.lastCard;
        else if (!$("timeUpPick").hidden) el = $("addBtn2");
        else el = $("who");
      }
      else if (!$("s-watch").hidden) el = $("timeUpBox").hidden ? $("startBtn") : $("keepBtn");
      if (!el || !vis(el)) el = items()[0] || null;
      set(el);
    }
    // 画面が変わって、わくの場所がなくなったら置きなおす
    function check() {
      var sc = scopeEl().id || "main";
      if (sc !== lastScope) {
        var prev = lastScope;
        if (prev === "main") saved = cur;
        lastScope = sc;
        var picked = prev === "favMenu" && pickedWho && $("who").value === pickedWho.name;
        if (sc === "main" && !picked && saved && items().indexOf(saved) >= 0) { set(saved); saved = null; return; }
        def(prev);
        return;
      }
      if (!cur || items().indexOf(cur) < 0) def();
    }
    var checkTimer = null;
    new MutationObserver(function () {
      if (checkTimer) return;
      checkTimer = setTimeout(function () { checkTimer = null; check(); }, 0);
    }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden", "disabled"] });

    function move(dir) {
      var list = items();
      if (!cur || list.indexOf(cur) < 0) { def(); return; }
      var r = cur.getBoundingClientRect(), best = null, bestScore = Infinity;
      var horiz = (dir === "left" || dir === "right");
      list.forEach(function (el) {
        if (el === cur) return;
        var q = el.getBoundingClientRect(), main, gap, off;
        if (dir === "right") main = q.left - r.right;
        else if (dir === "left") main = r.left - q.right;
        else if (dir === "down") main = q.top - r.bottom;
        else main = r.top - q.bottom;
        if (main < -6) return;
        if (horiz) {
          gap = Math.max(0, q.top - r.bottom, r.top - q.bottom);
          if (gap > 0) return;   // 左右は、同じ段にあるものだけ
          off = Math.abs((q.top + q.bottom) - (r.top + r.bottom)) / 2;
        } else {
          gap = Math.max(0, q.left - r.right, r.left - q.right);
          off = Math.abs((q.left + q.right) - (r.left + r.right)) / 2;
        }
        var score = Math.max(0, main) + gap * 4 + off * 0.05;
        if (score < bestScore) { bestScore = score; best = el; }
      });
      if (best) set(best);
    }

    function edit(el) {
      if (TVB && TVB.input) TVB.input(el.id, el.getAttribute("placeholder") || "", el.value);
      else el.focus();
    }
    function listen(id) {
      if (TVB && TVB.listen) TVB.listen(id);
      else toast("こえで さがすのは つかえないよ");
    }
    function ok() {
      if (busyCount) return;                 // よみこみ中の 二度おしは うけつけない
      check();
      var el = cur; if (!el) return;
      if (el.matches('input[type="search"]')) edit(el);
      else if (el.matches("label.chk")) el.querySelector("input").click();
      else el.click();
    }
    function fill(id, text, run) {
      var el = $(id);
      if (!el || !S || $("s-pick").hidden) return;
      el.value = text;
      if (id === "who") pickedWho = null;
      if (run) runSearch(id === "who" ? "who" : "word");
    }
    function playerState() {
      try { return (W && W.player && W.player.getPlayerState) ? W.player.getPlayerState() : -1; } catch (e) { return -1; }
    }
    function seek(d) {
      if (!W || !W.player || !W.player.seekTo) return;
      try { W.player.seekTo(Math.max(0, (W.player.getCurrentTime() || 0) + d), true); } catch (e) {}
    }

    // 10びょう もどす/すすめる
    $("rewBtn").onclick = function () { seek(-10); };
    $("fwdBtn").onclick = function () { seek(10); };
    // じまく: テレビでは、はじめは けしておく(きりかえは このテレビに おぼえる)
    var ccOn = false;
    try { ccOn = localStorage.getItem("gohoubi.cc") === "1"; } catch (e) {}
    function applyCc() {
      $("ccBtn").setAttribute("aria-pressed", String(ccOn));
      var p = W && W.player;
      if (!p) return;
      try { if (ccOn) p.loadModule("captions"); else p.unloadModule("captions"); } catch (e) {}
    }
    $("ccBtn").onclick = function () {
      ccOn = !ccOn;
      try { localStorage.setItem("gohoubi.cc", ccOn ? "1" : "0"); } catch (e) {}
      applyCc();
      toast(ccOn ? "じまくを だすよ" : "じまくを けすよ");
    };
    // ゆびで おす: テレビのアプリが出す ゆび(まる)を うごかして、プレーヤーの中のボタン(こうこくのスキップなど)を自分で押す
    var canPtr = !!(TVB && typeof TVB.pointer === "function"), ptrOn = false;
    function ptrOff(tell) {
      if (!ptrOn) return;
      ptrOn = false;
      $("ptrNote").hidden = true;
      if (tell) { try { TVB.pointer(false, 0, 0, 0, 0); } catch (e) {} }
    }
    $("ptrBtn").onclick = function () {
      if (!canPtr || !W || !W.player) return;
      var r = $("playerBox").getBoundingClientRect(), w = window.innerWidth, h = window.innerHeight;
      ptrOn = true;
      $("ptrNote").hidden = false;
      try { TVB.pointer(true, r.left / w, r.top / h, r.right / w, r.bottom / h); } catch (e) { ptrOff(false); }
    };
    tv.buttons = function (on) {
      ["rewBtn", "fwdBtn", "ccBtn"].forEach(function (id) { $(id).hidden = !on; });
      $("ptrBtn").hidden = !on || !canPtr;
    };
    tv.gone = function () { ptrOff(true); };
    tv.onPlaying = function () { applyCc(); setTimeout(applyCc, 1500); };
    applyCc();

    tv.reset = function () { def(); };
    tv.afterLoad = function (first) { if (first && vis(first)) set(first); else check(); };
    tv.playing = function (on) { try { if (TVB && TVB.playing) TVB.playing(!!on); } catch (e) {} };

    window.gohoubiTv = {
      key: function (k) {
        if (k === "up" || k === "down" || k === "left" || k === "right") move(k);
        else if (k === "ok") ok();
        else if (k === "mic") {
          if (!S || $("s-pick").hidden || $("pickMain").hidden || !$("confirm").hidden) return;
          var id = "q";
          if (cur && cur.id === "who") id = "who";
          else if (cur && cur.classList.contains("mic")) id = cur.getAttribute("data-for");
          listen(id);
        }
        else if ($("s-watch").hidden || $("startBtn").hidden) return;
        else if (k === "playpause") $("startBtn").click();
        else if (k === "play") { if (playerState() !== 1 && playerState() !== 3) $("startBtn").click(); }
        else if (k === "pause") { if (playerState() === 1 || playerState() === 3) $("startBtn").click(); }
        else if (k === "rew") seek(-10);
        else if (k === "ff") seek(10);
      },
      // もどるボタン。ここで受けたら true(① では false を返して、アプリを閉じる)
      back: function () {
        if (!$("confirm").hidden) { $("noAdd").click(); return true; }
        if (!$("favMenu").hidden) { closeFavs(); return true; }
        if (W) { leave(W, "つぎをえらぶ"); return true; }
        if (S) { goWho(); return true; }
        return false;
      },
      text: function (id, text, run) { fill(id, String(text || "").trim(), !!run); },
      voice: function (id, text) {
        text = String(text || "").trim();
        if (!text) { toast("きこえなかったよ"); return; }
        fill(id, text, false);   // 入れるだけ。さがすのは「さがす」を押したとき
        var go = $(id === "who" ? "whoForm" : "searchForm").querySelector('button[type="submit"]');
        if (S && go && vis(go)) set(go);   // わくを「さがす」に おく(けっていで さがす)
      },
      pointerOff: function () { ptrOff(false); },
      voiceError: function () { toast("こえで さがすのは つかえないよ"); },
      // ホームボタンなどで画面が見えなくなった: 止めて、見た分を保存する
      hidden: function () {
        if (!W) return;
        try { if (W.player && W.player.pauseVideo) W.player.pauseVideo(); } catch (e) {}
        if (W.started) requestSave(W);
      }
    };

    if (!TVB) {   // パソコンのキーボードで試すとき
      document.addEventListener("keydown", function (e) {
        var typing = document.activeElement && document.activeElement.matches && document.activeElement.matches("input[type=search]");
        var map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Enter: "ok", Escape: "back" };
        var k = map[e.key];
        if (!k) return;
        if (typing) {
          if (k === "left" || k === "right" || k === "ok") return;
          document.activeElement.blur();
        }
        e.preventDefault();
        if (k === "back") window.gohoubiTv.back(); else window.gohoubiTv.key(k);
      });
    }
    try { if (TVB && TVB.setNav) TVB.setNav(true); } catch (e) {}
  }
  if (TV) initTv();

  // ---- はじめ ----
  if (!GAS || !PASS) { show("s-nosetup"); return; }
  goWho();
})();
</script>
</body>
